name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 纯 Python 链路：与本机演练完全一致，不依赖 PowerShell 版本/执行策略。
      # 脚本内部会校验 tag 与 version.json、发布包必备文件、空模板 state.json，
      # 并把 zip 内 update.json 的 repo 写成正式更新源。
      - name: Build release package
        shell: bash
        run: |
          python scripts/publish_release.py \
            --version "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" 2>&1 | tee "$RUNNER_TEMP/pet-build.log"
          exit "${PIPESTATUS[0]}"

      # 失败时把云端环境与完整构建日志回写到 ci-debug 分支，便于本机排查。
      - name: Collect build diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-debug
          {
            echo "RUN_ID=$GITHUB_RUN_ID  SHA=$GITHUB_SHA"
            echo "=== python ==="
            python --version 2>&1 || true
            python -c "import sys, PyInstaller, tkinter; print(sys.executable, sys.stdout.encoding, PyInstaller.__version__)" 2>&1 || true
            echo "=== root ==="
            ls -la 2>&1 || true
            echo "=== publish ==="
            ls -laR publish 2>&1 || true
            echo "=== BUILD LOG ==="
            cat "$RUNNER_TEMP/pet-build.log" 2>&1 || true
          } > ci-debug/diagnostics.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-debug/diagnostics.txt
          git commit -m "CI diagnostics $GITHUB_RUN_ID" || true
          git push origin HEAD:ci-debug || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/DesktopPet.zip publish/latest.json --clobber
          else
            gh release create "$TAG" publish/DesktopPet.zip publish/latest.json \
              --title "DesktopPet $TAG" \
              --notes-file publish/notes.txt
          fi
