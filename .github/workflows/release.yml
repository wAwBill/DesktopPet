name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 纯 Python 链路：与本机演练完全一致，不依赖 PowerShell 版本/执行策略。
      # 脚本内部会校验 tag 与 version.json、发布包必备文件、空模板 state.json，
      # 并把 zip 内 update.json 的 repo 写成正式更新源。
      - name: Build release package
        shell: bash
        run: |
          python scripts/publish_release.py \
            --version "${{ github.ref_name }}" \
            --repo "${{ github.repository }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/DesktopPet.zip publish/latest.json --clobber
          else
            gh release create "$TAG" publish/DesktopPet.zip publish/latest.json \
              --title "DesktopPet $TAG" \
              --notes-file publish/notes.txt
          fi
