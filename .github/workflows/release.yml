name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify tag matches version.json
        shell: pwsh
        run: |
          $tag = ("${{ github.ref_name }}" -replace '^[vV]', '')
          $v = (Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if ($tag -ne $v) { throw "tag $tag 与 version.json 的 $v 不一致，发版前请先改 version.json" }
          Write-Host "版本校验通过: $v"

      - name: Build release package
        shell: pwsh
        run: ./scripts/publish-release.ps1 -Version "${{ github.ref_name }}" -Repo "${{ github.repository }}"

      - name: Verify package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("publish/DesktopPet.zip")
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            $required = @("小仓鼠桌宠.exe", "pet.py", "boat_fx.py", "updater.py",
                          "version.json", "config.json", "pets.json", "state.json")
            foreach ($f in $required) {
              if ($names -notcontains $f) { throw "发布包缺少 $f" }
            }
            $sr = [System.IO.StreamReader]::new($zip.GetEntry("state.json").Open())
            $state = $sr.ReadToEnd() | ConvertFrom-Json
            $sr.Dispose()
            if ($state.water -ne 0 -or $state.date -ne "") {
              throw "state.json 不是空模板，可能把用户数据带进了公开仓库"
            }
            Write-Host "发布包校验通过：$($names.Count) 个文件，state.json 为干净模板"
          } finally {
            $zip.Dispose()
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $meta = Get-Content publish/latest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $zip = Join-Path "publish" $meta.zip
          if (-not (Test-Path $zip)) { throw "找不到 $zip" }
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"
          if ($exists) {
            gh release upload $tag $zip publish/latest.json --clobber
          } else {
            gh release create $tag $zip publish/latest.json `
              --title "小仓鼠桌宠 $($meta.version)" --notes $meta.notes
          }
